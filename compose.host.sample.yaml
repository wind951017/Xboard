services:
  xboard:
    image: ${XBOARD_IMAGE:-ghcr.io/wind951017/xboard:latest}
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./.env:/www/.env
      - ./.docker/.data/:/www/.docker/.data
      - ./storage/logs:/www/storage/logs
      - ./storage/theme:/www/storage/theme
      - ./plugins:/www/plugins
      - redis-data:/data
    environment:
      - RESOURCE_PROFILE=balanced      # minimal | balanced | performance | auto
      - ENABLE_HORIZON=true
      - ENABLE_CADDY=false
      - ENABLE_WEB=true
      - ENABLE_REDIS=true
      - ENABLE_WS_SERVER=true
      - docker=true

volumes:
  redis-data:
